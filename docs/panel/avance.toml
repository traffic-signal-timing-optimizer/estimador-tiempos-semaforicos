# Avance del proyecto que muestra el panel (DEV31 F5). Se actualiza a mano al cerrar cada fase.
#
# Lo lee «bd panel». No es un dato de la base: es el resumen del proyecto para quien lo revisa.
# - estado: hecho, en_curso o pendiente;
# - acta: ruta en el repositorio; si no existe, «bd panel» lo avisa y una prueba lo rechaza;
# - un estado «hecho» sin acta no se admite.

[proyecto]
corto = "Estimador de tiempos semafóricos"
titulo = "Estimador de tiempos semafóricos"
objetivo = "Un modelo supervisado, entrenado fuera de línea, que propone el ciclo y los verdes de una intersección a partir de su demanda, y que se compara en SUMO con el plan actual, con Webster y con una búsqueda de referencia."
alcance = "Se evalúan la demora, las colas, las detenciones, la precisión, la factibilidad de los tiempos propuestos y el costo de calcularlos. Hoy el trabajo va en la etapa de simulación con demanda sintética: se está construyendo y comprobando el procedimiento antes de entrenar el modelo."

# Cómo se llama cada acceso: la red de SUMO solo tiene identificadores. Sentido comprobado con la
# geometría de la red (dirección de cada calle y nombre de la avenida en osm.net.xml.gz).
[accesos]
"279893869#6" = "Javier Prado, de este a oeste"
"1183810724#2" = "Javier Prado, de oeste a este"
"282567283#5" = "Los Frutales, de norte a sur"
"88161175#3" = "Los Frutales, de sur a norte"
"1436359637#0" = "Entrada menor"
"1185174556" = "Entrada menor"
"563085958" = "Entrada menor"

