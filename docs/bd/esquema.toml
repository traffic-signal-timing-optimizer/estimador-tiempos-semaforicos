# Esquema detallado de la base de datos «semaforo» (DEV31 F1).
#
# Fuente única del diseño: de este archivo salen el diccionario de datos (docs/bd/diccionario.md)
# y, en F3, las migraciones SQL. Se verifica y se regenera con:
#     .venv\Scripts\python.exe scripts\bd_esquema.py
#
# Convenciones:
# - nombre de tablas y columnas en español, en minúsculas y con guion bajo;
# - los valores codificados (estados, orígenes, etapas) se guardan tal como vienen en los
#   artefactos, en inglés; el diccionario los explica y las vistas del panel los traducen;
# - «nulo = true» marca las columnas que pueden quedar vacías; vacío nunca significa cero;
# - las unidades van en el nombre (_s, _vph, _veh, _m, _mps, _bytes) y en «unidad»;
# - «origen» dice de qué archivo y campo sale el dato, o qué proceso lo calcula;
# - cada tabla recibe además las columnas comunes (sección [comunes]); el generador las agrega.

version = "1.1.0-candidato"
fecha = "2026-11-08"
motor = "PostgreSQL 17.9"
estado = "aprobado en D11; C2 cerrada con P0–P9 completados"

[[esquemas]]
nombre = "control"
descripcion = "Quién cargó qué, con qué huella, los hitos del procedimiento y las incidencias de integridad."

[[esquemas]]
nombre = "caso"
descripcion = "El cruce: movimientos, clases de vehículo, tramos, grupos de verde, plan vigente, aforos y calibración."

[[esquemas]]
nombre = "experimento"
descripcion = "Familias y escenarios de demanda, su reparto en particiones y los protocolos de medición."

[[esquemas]]
nombre = "simulacion"
descripcion = "Lo que produce SUMO: planes, corridas, resultados, vehículos, eventos, colas, búsquedas, etiquetas y comparadores."

[[esquemas]]
nombre = "aprendizaje"
descripcion = "Conjuntos de entrenamiento, entrenamientos, métricas, modelos, selección y consultas al modelo."

[[esquemas]]
nombre = "evaluacion"
descripcion = "Evaluación final: experimentos, comparaciones, diferencias emparejadas, indicadores y costos."

[[tipos]]
nombre = "huella"
base = "text"
regla = "VALUE ~ '^[0-9a-f]{64}$'"
descripcion = "Huella SHA-256 en hexadecimal minúscula (64 caracteres)."

[comunes]
carga_id = { tipo = "text", descripcion = "Carga que escribió la fila.", origen = "cargador", referencia = "control.cargas" }
artefacto_id = { tipo = "text", descripcion = "Archivo de datos/ (o acta del repositorio) del que sale la fila.", origen = "cargador", referencia = "control.artefactos", visible_porque = "Relación común de procedencia: no define por sí sola la visibilidad de una fila; cada tabla declara su propio cegado. El archivo asociado se ciega por separado." }

[[roles]]
nombre = "semaforo_admin"
descripcion = "Dueño de los esquemas. Aplica las migraciones y registra los hitos con «bd hito». Solo lo usa el PO."
permisos = "Todo sobre los siete esquemas."

[[roles]]
nombre = "semaforo_carga"
descripcion = "Lo usa el cargador («bd cargar»)."
permisos = "USAGE en los esquemas; SELECT e INSERT en todas las tablas; UPDATE solo en las dos excepciones de «solo agregar». Ve todas las filas, también las de prueba."

[[roles]]
nombre = "semaforo_lectura"
descripcion = "Lo usan el panel, las consultas guardadas y el PO para consultar."
permisos = "USAGE y SELECT en todas las tablas y vistas. La seguridad por filas le oculta lo que esté cegado."

[[roles]]
nombre = "semaforo_panel"
descripcion = "Rol exclusivo del panel local; solo consulta las vistas revisadas."
permisos = "USAGE en vistas y SELECT en las vistas aprobadas; ningún permiso directo sobre tablas."

[[roles]]
nombre = "postgres"
descripcion = "Administrador del servicio PostgreSQL de la laptop."
permisos = "Solo el PO. El proyecto no lo usa."

[[funciones]]
nombre = "control.escenarios_cegados"
clase = "vista"
descripcion = "Escenarios asignados a «test» en una partición cuya prueba no tiene hito de apertura. ADR07 permite mostrar los identificadores y la asignación para auditar el cegado, sin exponer resultados ni archivos. Es la base del cegado."

[[funciones]]
nombre = "control.prueba_abierta(particion_id)"
clase = "función"
descripcion = "Verdadero si existe un hito «test_opened» para esa partición."

[[funciones]]
nombre = "control.escenario_visible(escenario_id)"
clase = "función"
descripcion = "Filtro explícito de las vistas del panel: excluye los escenarios de prueba cerrada aun cuando la vista lea con permisos del dueño."

[[funciones]]
nombre = "control.archivo_visible(artefacto_id)"
clase = "función"
descripcion = "Un archivo global es visible; uno de escenarios exige enlaces y que todos estén abiertos; uno de alcance desconocido queda oculto. La misma regla ciega el archivo y sus enlaces, para no revelar la ruta por artefacto_id."

[[funciones]]
nombre = "control.bloquear_cambios()"
clase = "disparador"
descripcion = "Rechaza UPDATE y DELETE en todas las tablas, salvo las dos excepciones declaradas (cierre de una carga y decisión de un conflicto)."

[[funciones]]
nombre = "control.validar_hito()"
clase = "disparador"
descripcion = "Exige el orden de los hitos: protocolo y partición congelados antes que el modelo; modelo congelado antes de abrir la prueba."

[[funciones]]
nombre = "experimento.validar_asignacion()"
clase = "disparador"
descripcion = "Una familia completa va a una sola partición y asignación; un escenario cargado como preliminar no puede pasar a «test»."

[[funciones]]
nombre = "simulacion.validar_corrida()"
clase = "disparador"
descripcion = "La etapa «final» solo en escenarios asignados a «test»; la semilla debe pertenecer a la etapa del protocolo."

[[funciones]]
nombre = "simulacion.validar_cola()"
clase = "disparador"
descripcion = "Cada acceso de la cola tiene un valor por paso de la serie de su corrida (las tres listas con la misma longitud); si no, se rechaza con SM006."

[[funciones]]
nombre = "aprendizaje.validar_conjunto_etiqueta()"
clase = "disparador"
descripcion = "Una etiqueta entra a un conjunto solo si su escenario está asignado a «train» o «validation» en la misma partición; nunca a «test»."

[[vistas]]
nombre = "vistas.zona_escenario"
descripcion = "Cada escenario con su partición, su asignación, su zona (desarrollo o prueba) y si su prueba ya se abrió."
fuentes = ["experimento.escenarios", "experimento.asignaciones", "control.hitos"]

[[vistas]]
nombre = "vistas.estado_hitos"
descripcion = "Línea de tiempo de los hitos del procedimiento, con su acta y su commit."
fuentes = ["control.hitos", "control.artefactos"]

[[vistas]]
nombre = "vistas.estado_cargas"
descripcion = "Cargas, artefactos cargados y rechazados, y conflictos pendientes."
fuentes = ["control.cargas", "control.artefactos", "control.conflictos"]

[[vistas]]
nombre = "vistas.corridas_resumen"
descripcion = "Una fila por corrida con su escenario, familia, plan, etapa, estado y resultados principales."
fuentes = ["simulacion.corridas", "simulacion.resultados_corrida", "experimento.escenarios", "simulacion.planes"]

[[vistas]]
nombre = "vistas.vehiculos_cohorte"
descripcion = "Vehículos de la cohorte con su demora (pérdida de tiempo más espera de salida, según la definición del protocolo)."
fuentes = ["simulacion.vehiculos"]

[[vistas]]
nombre = "vistas.cola_por_segundo"
descripcion = "Cola por corrida, acceso y paso (una fila por paso, como antes del cambio a arreglo por acceso). El panel y las consultas leen esta vista, nunca la tabla, para poder cambiar cómo se guarda."
fuentes = ["simulacion.cola_por_acceso", "simulacion.resultados_corrida"]

[[vistas]]
nombre = "vistas.busquedas_resumen"
descripcion = "Una fila por búsqueda con su etiqueta, sus candidatos elegibles y sus motivos de descarte."
fuentes = ["simulacion.busquedas", "simulacion.candidatos", "simulacion.etiquetas"]

[[vistas]]
nombre = "vistas.etiquetas_entrenamiento"
descripcion = "Etiquetas con referencia y la asignación de su escenario (solo train y validation)."
fuentes = ["simulacion.etiquetas", "experimento.asignaciones"]

[[vistas]]
nombre = "vistas.metricas_modelos"
descripcion = "Métricas de cada entrenamiento por partición, en columnas, para comparar la mediana con XGBoost."
fuentes = ["aprendizaje.metricas_modelo", "aprendizaje.entrenamientos"]

[[vistas]]
nombre = "vistas.consultas_resumen"
descripcion = "Consultas con su estado, sus tiempos y sus reglas incumplidas."
fuentes = ["aprendizaje.consultas", "aprendizaje.consulta_reglas"]

[[vistas]]
nombre = "vistas.indicadores_finales"
descripcion = "Indicadores I4 a I7 del experimento final con sus intervalos. Vacía hasta la apertura."
fuentes = ["evaluacion.indicadores", "evaluacion.experimentos"]

# =====================================================================================
# control
# =====================================================================================

[[tablas]]
esquema = "control"
nombre = "cargas"
descripcion = "Cada vez que el cargador escribe en la base."
grano = "Una fila por carga"
origen = "El propio cargador («bd cargar»)."
fuente = "existe"
filas_dev16 = "decenas"
cegado = "no"
excepcion_solo_agregar = "Se permite una sola modificación: cerrar la carga (de running a completed, rejected o interrupted) completando fin, conteos y huella."
comunes = []
clave_primaria = ["carga_id"]
columnas = [
  { nombre = "carga_id", tipo = "text", descripcion = "Identificador de la carga: fecha UTC de inicio y 8 caracteres aleatorios.", origen = "cargador" },
  { nombre = "inicio", tipo = "timestamptz", descripcion = "Momento en que empieza la carga.", origen = "cargador" },
  { nombre = "fin", tipo = "timestamptz", nulo = true, descripcion = "Momento en que termina; vacío mientras está en curso o si se interrumpió.", origen = "cargador" },
  { nombre = "estado", tipo = "text", descripcion = "running (en curso), completed (completa), rejected (rechazada) o interrupted (interrumpida).", origen = "cargador", regla = "estado IN ('running','completed','rejected','interrupted')" },
  { nombre = "comando", tipo = "jsonb", descripcion = "Argumentos del comando, sin rutas de la máquina.", origen = "cargador" },
  { nombre = "version_paquete", tipo = "text", descripcion = "Versión del paquete semaforo que cargó.", origen = "cargador" },
  { nombre = "commit_codigo", tipo = "text", nulo = true, descripcion = "Commit del código que cargó; vacío si no se pudo leer.", origen = "git" },
  { nombre = "arbol_limpio", tipo = "boolean", nulo = true, descripcion = "Si el código no tenía cambios sin commit; vacío si no se pudo saber.", origen = "git" },
  { nombre = "version_postgres", tipo = "text", descripcion = "Versión exacta del servidor.", origen = "SHOW server_version" },
  { nombre = "version_esquema", tipo = "text", descripcion = "Última migración aplicada.", origen = "migraciones" },
  { nombre = "artefactos_leidos", tipo = "integer", nulo = true, descripcion = "Archivos revisados.", origen = "cargador", regla = "artefactos_leidos >= 0" },
  { nombre = "artefactos_cargados", tipo = "integer", nulo = true, descripcion = "Archivos que entraron.", origen = "cargador", regla = "artefactos_cargados >= 0" },
  { nombre = "artefactos_rechazados", tipo = "integer", nulo = true, descripcion = "Archivos que no entraron, con motivo en artefactos o conflictos.", origen = "cargador", regla = "artefactos_rechazados >= 0" },
  { nombre = "filas_por_tabla", tipo = "jsonb", nulo = true, descripcion = "Filas insertadas por tabla.", origen = "cargador" },
  { nombre = "huella_contenido", tipo = "huella", nulo = true, descripcion = "Huella del contenido completo de la base al terminar (QA36).", origen = "bd verificar" },
]
reglas = [
  { nombre = "fin_posterior", sql = "fin IS NULL OR fin >= inicio", descripcion = "La carga no termina antes de empezar." },
  { nombre = "en_curso_sin_fin", sql = "(estado = 'running') = (fin IS NULL)", descripcion = "Solo una carga en curso está sin fin." },
]

[[tablas]]
esquema = "control"
nombre = "artefactos"
descripcion = "Cada archivo que la base conoce, con su huella. Es el enlace de cada fila con su original."
grano = "Una fila por archivo"
origen = "Manifiestos de cada carpeta publicada; las actas de los hitos (raíz repositorio)."
fuente = "existe"
filas_dev16 = "unas 60 000"
cegado = "archivo_alcance"
comunes = ["carga_id"]
clave_primaria = ["artefacto_id"]
columnas = [
  { nombre = "artefacto_id", tipo = "text", descripcion = "Raíz y ruta, por ejemplo datos:ejecuciones/<run_id>/outputs/tripinfo.xml.", origen = "cargador" },
  { nombre = "raiz", tipo = "text", descripcion = "datos (carpeta de datos) o repositorio (actas del repositorio de código).", origen = "cargador", regla = "raiz IN ('datos','repositorio')" },
  { nombre = "ruta_relativa", tipo = "text", descripcion = "Ruta dentro de la raíz, con «/», sin la ruta de la máquina.", origen = "manifiesto: path" },
  { nombre = "tipo", tipo = "text", descripcion = "Clase de archivo (lista controlada en el cargador): manifest, inputs_manifest, case, scenario, split, protocol, tripinfo, fcd, cohort, reconciliation, summary, timing, sumo_log, metrics, trace, label, coverage, comparators, parameters, replica, quality, model_manifest, model_file, response, evaluation, minutes, other.", origen = "cargador" },
  { nombre = "tamano_bytes", tipo = "bigint", unidad = "bytes", descripcion = "Tamaño del archivo.", origen = "sistema de archivos", regla = "tamano_bytes >= 0" },
  { nombre = "sha256", tipo = "huella", descripcion = "Huella del contenido, recalculada al cargar.", origen = "manifiesto: sha256 (verificada)" },
  { nombre = "manifiesto_id", tipo = "text", nulo = true, descripcion = "Manifiesto que declara este archivo; vacío si es un manifiesto o un acta.", origen = "cargador" },
  { nombre = "estado", tipo = "text", descripcion = "intact (huella coincide), unknown (sin manifiesto reconocido), not_loadable (no se pudo leer) o rejected (rechazado por conflicto).", origen = "cargador", regla = "estado IN ('intact','unknown','not_loadable','rejected')" },
  { nombre = "alcance", tipo = "text", descripcion = "global, escenarios o desconocido. Los desconocidos quedan ocultos hasta clasificarlos.", origen = "cargador", regla = "alcance IN ('global','escenarios','desconocido')" },
  { nombre = "motivo", tipo = "text", nulo = true, descripcion = "Por qué no está intact; vacío si lo está.", origen = "cargador" },
  { nombre = "registrado_en", tipo = "timestamptz", descripcion = "Cuándo se registró.", origen = "cargador" },
]
claves_foraneas = [
  { columnas = ["manifiesto_id"], referencia = "control.artefactos", referidas = ["artefacto_id"], opcional = true },
]
unicas = [["raiz", "ruta_relativa"]]
reglas = [
  { nombre = "motivo_si_no_intacto", sql = "estado = 'intact' OR motivo IS NOT NULL", descripcion = "Todo lo que no está intacto lleva motivo." },
]

[[tablas]]
esquema = "control"
nombre = "archivo_escenarios"
descripcion = "Escenarios a los que corresponde un archivo. Todos deben ser visibles para mostrar el archivo."
grano = "Una fila por archivo y escenario vinculado"
origen = "Unidades de carga de corridas, búsquedas, escenarios y particiones"
fuente = "DEV31 C2.6"
filas_dev16 = "según archivos de corridas y escenarios"
cegado = "archivo_enlace"
comunes = ["carga_id"]
clave_primaria = ["artefacto_id", "escenario_id"]
columnas = [
  { nombre = "artefacto_id", tipo = "text", descripcion = "Archivo vinculado.", origen = "control.artefactos" },
  { nombre = "escenario_id", tipo = "text", descripcion = "Escenario vinculado.", origen = "unidad de carga" },
]
claves_foraneas = [
  { columnas = ["artefacto_id"], referencia = "control.artefactos", referidas = ["artefacto_id"] },
  { columnas = ["escenario_id"], referencia = "experimento.escenarios", referidas = ["escenario_id"] },
]

[[tablas]]
esquema = "control"
nombre = "entornos"
descripcion = "Versiones y equipo con que se produjo un resultado."
grano = "Una fila por combinación distinta de versiones"
origen = "manifest.json: environment (corridas); manifiestos de entrenamiento y evaluación."
fuente = "existe"
filas_dev16 = "pocas"
cegado = "no"
clave_primaria = ["entorno_id"]
columnas = [
  { nombre = "entorno_id", tipo = "huella", descripcion = "Huella de los valores de esta fila.", origen = "cargador" },
  { nombre = "version_sumo", tipo = "text", nulo = true, descripcion = "Versión de SUMO; vacía en procesos sin SUMO.", origen = "manifest.json: environment.sumo" },
  { nombre = "version_python", tipo = "text", descripcion = "Versión de Python.", origen = "manifest.json: environment.python" },
  { nombre = "sistema_operativo", tipo = "text", descripcion = "Sistema operativo.", origen = "manifest.json: environment.os" },
  { nombre = "commit_codigo", tipo = "text", nulo = true, descripcion = "Commit del proyecto con que corrió el proceso; vacío en las corridas anteriores a DEV31 F2.", origen = "manifest.json: environment.commit (desde F2)" },
  { nombre = "codigo_modificado", tipo = "boolean", nulo = true, descripcion = "Verdadero si, al correr, los archivos que git sigue tenían cambios sin confirmar (el commit no describe todo el código). Los archivos nuevos sin seguir no cuentan. Vacío si no hay commit.", origen = "manifest.json: environment.code_modified (desde F2)", regla = "codigo_modificado IS NULL OR commit_codigo IS NOT NULL" },
  { nombre = "motivo_sin_commit", tipo = "text", nulo = true, descripcion = "Por qué falta el commit, por ejemplo «no registrado antes de DEV31».", origen = "cargador" },
  { nombre = "librerias", tipo = "jsonb", descripcion = "Versiones de librerías relevantes; objeto vacío si no aplica.", origen = "manifiesto del proceso" },
  { nombre = "ubicacion", tipo = "text", nulo = true, descripcion = "Dónde corrió el proceso: «local» (la computadora del proyecto) o «nube» (cualquier proveedor). Se declara con SEMAFORO_UBICACION; sin declaración, local, salvo que el equipo se presente como máquina de una nube conocida. Vacío en las corridas anteriores a DEV31 F2 (no registrado). El manifiesto guarda «local» o «cloud»; la base lo traduce a «local» o «nube».", origen = "manifest.json: environment.location (desde F2)", regla = "ubicacion IS NULL OR ubicacion IN ('local','nube')" },
  { nombre = "proveedor_nube", tipo = "text", nulo = true, descripcion = "Proveedor de la nube cuando ubicacion = nube (por ejemplo AWS, Azure o Google Cloud), declarado con SEMAFORO_NUBE_PROVEEDOR o tomado del equipo; «no identificado» si no se sabe. Vacío si es local.", origen = "manifest.json: environment.cloud_provider (desde F2)" },
  { nombre = "tipo_maquina", tipo = "text", nulo = true, descripcion = "Tipo o modelo de la máquina virtual que reporta la nube (SEMAFORO_NUBE_TIPO_MAQUINA o el equipo). Vacío si es local o si no se conoce.", origen = "manifest.json: environment.machine_type (desde F2)" },
  { nombre = "region", tipo = "text", nulo = true, descripcion = "Región o centro de datos de la nube (SEMAFORO_NUBE_REGION). Vacío si es local o si no se declaró.", origen = "manifest.json: environment.region (desde F2)" },
  { nombre = "procesador", tipo = "text", nulo = true, descripcion = "Modelo del procesador tal como lo reporta el sistema operativo (I7). Ejemplo: AMD Ryzen 9 4900HS with Radeon Graphics.", origen = "manifest.json: environment.cpu (desde F2)" },
  { nombre = "nucleos", tipo = "integer", nulo = true, descripcion = "Número de núcleos lógicos del equipo (I7).", origen = "manifest.json: environment.cpu_cores (desde F2)", regla = "nucleos IS NULL OR nucleos > 0" },
  { nombre = "memoria_gb", tipo = "double precision", nulo = true, unidad = "GB", descripcion = "Memoria RAM total del equipo o de la máquina virtual, con un decimal (I7).", origen = "manifest.json: environment.memory_gb (desde F2)", regla = "memoria_gb IS NULL OR memoria_gb > 0" },
]
reglas = [
  { nombre = "commit_o_motivo", sql = "commit_codigo IS NOT NULL OR motivo_sin_commit IS NOT NULL", descripcion = "Si falta el commit, se dice por qué." },
  { nombre = "nube_con_proveedor", sql = "ubicacion IS DISTINCT FROM 'nube' OR proveedor_nube IS NOT NULL", descripcion = "Si el proceso corrió en la nube, se registra el proveedor (aunque sea «no identificado»)." },
]

[[tablas]]
esquema = "control"
nombre = "hitos"
descripcion = "Pasos fechados del procedimiento que el jurado puede pedir: congelar el protocolo, la partición y el modelo, y abrir la prueba."
grano = "Una fila por hito"
origen = "Comando «bd hito» con el acta que lo autoriza (artefacto_id apunta al acta)."
fuente = "pendiente F3"
filas_dev16 = "decenas"
cegado = "no"
visible_porque = "ADR07 hace pública la secuencia de congelamientos y la apertura; no expone resultados de prueba."
clave_primaria = ["hito_id"]
columnas = [
  { nombre = "hito_id", tipo = "text", descripcion = "Identificador del hito.", origen = "bd hito" },
  { nombre = "tipo", tipo = "text", descripcion = "protocol_frozen, split_frozen, model_frozen o test_opened.", origen = "bd hito", regla = "tipo IN ('protocol_frozen','split_frozen','model_frozen','test_opened')" },
  { nombre = "registrado_en", tipo = "timestamptz", descripcion = "Cuándo se registró.", origen = "bd hito" },
  { nombre = "protocolo_id", tipo = "text", nulo = true, descripcion = "Protocolo congelado (tipo protocol_frozen).", origen = "bd hito" },
  { nombre = "particion_id", tipo = "text", nulo = true, descripcion = "Partición congelada, o cuya prueba se abre.", origen = "bd hito" },
  { nombre = "modelo_id", tipo = "text", nulo = true, descripcion = "Modelo congelado (tipo model_frozen).", origen = "bd hito" },
  { nombre = "experimento_id", tipo = "text", nulo = true, descripcion = "Experimento cuya prueba se abre (tipo test_opened).", origen = "bd hito" },
  { nombre = "seleccion_id", tipo = "text", nulo = true, descripcion = "Selección fijada al congelar el modelo; no cambia con selecciones posteriores.", origen = "aprendizaje.seleccion al registrar model_frozen" },
  { nombre = "huella_seleccion", tipo = "huella", nulo = true, descripcion = "Huella de la selección fijada al congelar el modelo.", origen = "aprendizaje.seleccion al registrar model_frozen" },
  { nombre = "huella_objeto", tipo = "huella", descripcion = "Huella del objeto en el momento del hito.", origen = "artefacto del objeto" },
