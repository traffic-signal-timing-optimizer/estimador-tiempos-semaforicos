  { nombre = "motivo_zona_no_disponible", tipo = "text", nulo = true, descripcion = "Por qué no hay datos de la zona.", origen = "metricas.json: zone_unavailable" },
  { nombre = "carriles_zona", tipo = "jsonb", nulo = true, descripcion = "Carriles medidos.", origen = "metricas.json: zone.settings.zone_lane_ids" },
  { nombre = "umbral_cola_mps", tipo = "double precision", nulo = true, unidad = "m/s", descripcion = "Umbral de cola usado.", origen = "metricas.json: zone.settings.queue_speed_threshold_mps" },
  { nombre = "umbral_detencion_mps", tipo = "double precision", nulo = true, unidad = "m/s", descripcion = "Umbral de detención usado.", origen = "metricas.json: zone.settings.stop_speed_threshold_mps" },
  { nombre = "muestreo_cola_s", tipo = "double precision", nulo = true, unidad = "s", descripcion = "Muestreo de la cola.", origen = "metricas.json: zone.settings.queue_sampling_s" },
  { nombre = "inicio_medicion_s", tipo = "double precision", nulo = true, unidad = "s", descripcion = "Inicio de la medición de la zona.", origen = "metricas.json: zone.settings.measure_start_s" },
  { nombre = "fin_medicion_s", tipo = "double precision", nulo = true, unidad = "s", descripcion = "Fin de la medición de la zona.", origen = "metricas.json: zone.settings.measure_end_s" },
  { nombre = "estado_cola", tipo = "text", nulo = true, descripcion = "complete, incomplete o empty.", origen = "metricas.json: zone.queue.status", regla = "estado_cola IS NULL OR estado_cola IN ('complete','incomplete','empty')" },
  { nombre = "ticks_esperados", tipo = "integer", nulo = true, descripcion = "Muestras de cola esperadas.", origen = "metricas.json: zone.queue.ticks_expected" },
  { nombre = "ticks_observados", tipo = "integer", nulo = true, descripcion = "Muestras de cola observadas.", origen = "metricas.json: zone.queue.ticks_observed" },
  { nombre = "cobertura_cola", tipo = "double precision", nulo = true, unidad = "fracción", descripcion = "Observadas entre esperadas.", origen = "metricas.json: zone.queue.coverage" },
  { nombre = "vehiculo_ticks", tipo = "bigint", nulo = true, descripcion = "Suma de vehículos en cola en todas las muestras.", origen = "metricas.json: zone.queue.vehicle_ticks" },
  { nombre = "cola_media_veh", tipo = "double precision", nulo = true, unidad = "veh", descripcion = "Cola media en la zona.", origen = "metricas.json: zone.queue.mean_vehicles" },
  { nombre = "cola_maxima_veh", tipo = "integer", nulo = true, unidad = "veh", descripcion = "Cola máxima en la zona.", origen = "metricas.json: zone.queue.max_vehicles" },
  { nombre = "estado_detenciones", tipo = "text", nulo = true, descripcion = "complete, censored o empty.", origen = "metricas.json: zone.stops.status", regla = "estado_detenciones IS NULL OR estado_detenciones IN ('complete','censored','empty')" },
  { nombre = "detenciones_solicitados", tipo = "integer", nulo = true, unidad = "veh", descripcion = "Vehículos considerados para detenciones.", origen = "metricas.json: zone.stops.requested" },
  { nombre = "detenciones_total", tipo = "integer", nulo = true, descripcion = "Detenciones totales.", origen = "metricas.json: zone.stops.total_stops" },
  { nombre = "detenciones_media", tipo = "double precision", nulo = true, descripcion = "Detenciones por vehículo.", origen = "metricas.json: zone.stops.mean_stops" },
  { nombre = "cota_inf_detenciones", tipo = "double precision", nulo = true, descripcion = "Cota inferior de detenciones por vehículo.", origen = "metricas.json: zone.stops.lower_bound_mean_stops" },
  { nombre = "pasos_fcd", tipo = "integer", nulo = true, descripcion = "Pasos leídos del archivo de posiciones.", origen = "metricas.json: zone.fcd_steps" },
  { nombre = "pasos_cola_s", tipo = "double precision[]", nulo = true, unidad = "s", descripcion = "Momento finito y no negativo de cada paso de la serie de cola, en orden estricto (la misma para todos los accesos de la corrida). Vacío sin zona.", origen = "metricas.json: zone.queue_series.times_s", regla = "array_position(pasos_cola_s, NULL) IS NULL AND 0 <= ALL(pasos_cola_s) AND 'Infinity'::double precision > ALL(pasos_cola_s)" },
  { nombre = "pasos_en_ventana", tipo = "boolean[]", nulo = true, descripcion = "Si cada paso cuenta para la cola del resumen (intervalo de medición y momento de muestreo), en el mismo orden que pasos_cola_s. Los demás pasos (calentamiento, vaciado) se guardan, pero no entran en las medias. Vacío sin zona.", origen = "metricas.json: zone.queue_series.in_window", regla = "array_position(pasos_en_ventana, NULL) IS NULL" },
]
claves_foraneas = [
  { columnas = ["run_id"], referencia = "simulacion.corridas", referidas = ["run_id"], uno_a_uno = true },
  { columnas = ["artefacto_metricas_id"], referencia = "control.artefactos", referidas = ["artefacto_id"], opcional = true },
  { columnas = ["protocolo_metricas_id"], referencia = "experimento.protocolos", referidas = ["protocolo_id"], opcional = true },
]
reglas = [
  { nombre = "demora_completa", sql = "estado_demora IS DISTINCT FROM 'complete' OR demora_media_s IS NOT NULL", descripcion = "Con cohorte completa hay demora media." },
  { nombre = "demora_censurada", sql = "estado_demora IS DISTINCT FROM 'censored' OR (demora_media_s IS NULL AND cota_inf_demora_s IS NOT NULL)", descripcion = "Con cohorte incompleta no hay media: solo la cota inferior." },
  { nombre = "zona_con_motivo", sql = "zona_disponible IS DISTINCT FROM false OR motivo_zona_no_disponible IS NOT NULL", descripcion = "Si falta la zona, se dice por qué." },
]

