  { nombre = "acceso", tipo = "text", descripcion = "Acceso: una clave de zone.queue_series.vehicles_by_access.", origen = "metricas.json: zone.queue_series.vehicles_by_access (clave)" },
  { nombre = "vehiculos_en_cola", tipo = "integer[]", unidad = "veh", descripcion = "Vehículos no negativos del acceso con velocidad menor o igual que el umbral de cola, en los carriles de la zona, en cada paso (un número por paso, en el orden de pasos_cola_s de la corrida). Un paso que la FCD no trae no tiene valor: no se rellena con cero.", origen = "metricas.json: zone.queue_series.vehicles_by_access[acceso]", regla = "array_position(vehiculos_en_cola, NULL) IS NULL AND 0 <= ALL(vehiculos_en_cola)" },
]
