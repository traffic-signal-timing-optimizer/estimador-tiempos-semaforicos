  { nombre = "demora_salida_media_s", tipo = "double precision", nulo = true, unidad = "s", descripcion = "Espera media para entrar, de todos los vehículos.", origen = "summary.json: mean_depart_delay_s" },
  { nombre = "demanda_insatisfecha", tipo = "boolean", descripcion = "Si quedó demanda sin atender.", origen = "summary.json: demand_unmet" },
  { nombre = "hallazgos", tipo = "jsonb", descripcion = "Observaciones de la corrida (avisos, teletransportes, choques...).", origen = "summary.json: findings" },
  { nombre = "version_metricas", tipo = "text", nulo = true, descripcion = "Versión del formato de métricas.", origen = "metricas.json: schema_version" },
  { nombre = "protocolo_metricas_id", tipo = "text", nulo = true, descripcion = "Protocolo con que se calcularon las métricas.", origen = "metricas.json: protocol_id" },
  { nombre = "estado_protocolo_metricas", tipo = "text", nulo = true, descripcion = "draft o frozen.", origen = "metricas.json: protocol_status", regla = "estado_protocolo_metricas IS NULL OR estado_protocolo_metricas IN ('draft','frozen')" },
  { nombre = "definicion_demora", tipo = "text", nulo = true, descripcion = "Definición de demora usada.", origen = "metricas.json: delay_definition" },
  { nombre = "origen_caso", tipo = "text", nulo = true, descripcion = "synthetic o field.", origen = "metricas.json: case_origin", regla = "origen_caso IS NULL OR origen_caso IN ('synthetic','field')" },
  { nombre = "origen_demanda", tipo = "text", nulo = true, descripcion = "synthetic o field.", origen = "metricas.json: demand_origin", regla = "origen_demanda IS NULL OR origen_demanda IN ('synthetic','field')" },
  { nombre = "origen_evidencia", tipo = "text", nulo = true, descripcion = "field solo si caso y demanda lo son; si no, synthetic (auditoría A03).", origen = "metricas.json: evidence_origin", regla = "origen_evidencia IS NULL OR origen_evidencia IN ('synthetic','field')" },
  { nombre = "cohorte_solicitada", tipo = "integer", nulo = true, unidad = "veh", descripcion = "Vehículos de la cohorte pedidos.", origen = "metricas.json: cohort.total.requested" },
  { nombre = "cohorte_terminada", tipo = "integer", nulo = true, unidad = "veh", descripcion = "Vehículos de la cohorte que terminaron.", origen = "metricas.json: cohort.total.finished" },
  { nombre = "cohorte_sin_terminar", tipo = "integer", nulo = true, unidad = "veh", descripcion = "Vehículos de la cohorte que no terminaron.", origen = "metricas.json: cohort.total.unfinished" },
  { nombre = "cohorte_no_insertada", tipo = "integer", nulo = true, unidad = "veh", descripcion = "Vehículos de la cohorte que no entraron.", origen = "metricas.json: cohort.total.not_inserted" },
  { nombre = "estado_demora", tipo = "text", nulo = true, descripcion = "complete (cohorte completa), censored (incompleta: solo cota inferior) o empty (sin vehículos).", origen = "metricas.json: cohort.total.status", regla = "estado_demora IS NULL OR estado_demora IN ('complete','censored','empty')" },
  { nombre = "suma_demora_s", tipo = "double precision", nulo = true, unidad = "s", descripcion = "Suma de demoras de la cohorte.", origen = "metricas.json: cohort.total.sum_delay_s" },
  { nombre = "demora_media_s", tipo = "double precision", nulo = true, unidad = "s", descripcion = "Demora media por vehículo (pérdida de tiempo más espera de salida); vacía si la cohorte no terminó.", origen = "metricas.json: cohort.total.mean_delay_s" },
  { nombre = "perdida_tiempo_media_s", tipo = "double precision", nulo = true, unidad = "s", descripcion = "Media de la pérdida de tiempo (timeLoss).", origen = "metricas.json: cohort.total.mean_time_loss_s" },
  { nombre = "demora_salida_media_cohorte_s", tipo = "double precision", nulo = true, unidad = "s", descripcion = "Media de la espera de salida de la cohorte.", origen = "metricas.json: cohort.total.mean_depart_delay_s" },
  { nombre = "cota_inf_demora_s", tipo = "double precision", nulo = true, unidad = "s", descripcion = "Demora media mínima cuando la cohorte no terminó.", origen = "metricas.json: cohort.total.lower_bound_mean_delay_s" },
  { nombre = "cota_inf_perdida_tiempo_s", tipo = "double precision", nulo = true, unidad = "s", descripcion = "Cota inferior de la pérdida de tiempo.", origen = "metricas.json: cohort.total.lower_bound_mean_time_loss_s" },
  { nombre = "cota_inf_demora_salida_s", tipo = "double precision", nulo = true, unidad = "s", descripcion = "Cota inferior de la espera de salida.", origen = "metricas.json: cohort.total.lower_bound_mean_depart_delay_s" },
  { nombre = "vehiculos_calentamiento", tipo = "integer", nulo = true, unidad = "veh", descripcion = "Vehículos del calentamiento (fuera de la cohorte).", origen = "metricas.json: cohort.warmup_vehicles" },
