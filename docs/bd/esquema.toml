  { nombre = "teletransportes_cruce", tipo = "integer", descripcion = "Teletransportes al ceder el paso.", origen = "summary.json: teleports_yield", regla = "teletransportes_cruce >= 0" },
  { nombre = "teletransportes_carril", tipo = "integer", descripcion = "Teletransportes por carril equivocado.", origen = "summary.json: teleports_wrong_lane", regla = "teletransportes_carril >= 0" },
  { nombre = "choques", tipo = "integer", descripcion = "Choques.", origen = "summary.json: collisions", regla = "choques >= 0" },
