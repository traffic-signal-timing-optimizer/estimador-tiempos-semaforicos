# Solo hooks rápidos y autocontenidos. Tipos y pruebas: scripts/check.ps1.
# La versión de ruff debe coincidir con la de uv.lock (la comprueba scripts/check.ps1).
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^tools/contracts/
      - id: ruff-format
        exclude: ^tools/contracts/
