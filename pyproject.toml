[project]
name = "semaforo"
version = "0.1.0"
description = "Prototipo local de estimación de tiempos semafóricos con SUMO (caso sintético)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "pydantic>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "pyright>=1.1",
    "pre-commit>=3",
    "pip-audit>=2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semaforo"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Código de referencia entregado por la documentación; se conserva sin reformatear.
extend-exclude = ["tools/contracts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ANN", "RUF", "PL"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]

[tool.pyright]
include = ["src", "tests"]
# Resuelve los paquetes con el entorno del proyecto, no con el Python del sistema.
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "sumo: requiere el binario de SUMO instalado (SUMO_HOME)",
]
